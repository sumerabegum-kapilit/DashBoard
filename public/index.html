<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/studio.css">
</head>
<body class="studio">
  <div class="app">
    <aside class="rail">
      <div class="rail-inner">
        <div class="brand"><span class="brand-mark">◆</span> Studio</div>
        <label class="rail-field"><span class="flabel">Data source</span><select id="source" aria-label="Data source"></select></label>
        <button type="button" class="btn small ghost" id="add-source">+ Add data</button>
        <div class="rail-head"><span class="flabel">Dashboards</span></div>
        <nav class="dash-nav" id="dash-list" aria-label="Dashboards"></nav>
        <nav class="dash-nav" aria-label="Data"><a id="model-link" href="#">Model and relationships</a><a id="data-link" href="#">Data and fields</a></nav>
        <p class="note rail-note" id="source-note"></p>
        <button type="button" class="btn small ghost" id="theme" aria-label="Switch light or dark">◐ Light / dark</button>
      </div>
    </aside>
    <main class="main" id="main"><p class="empty">Loading…</p></main>
  </div>
  <aside class="drawer" id="drawer" hidden aria-label="Widget editor"></aside>
  <dialog class="dlg" id="modal"></dialog>
  <div class="pop" id="pop" role="menu" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/vendor/d3.min.js"></script>
  <script type="module" src="/js/studio/main.js"></script>
</body>
</html>
