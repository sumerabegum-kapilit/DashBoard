<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Baseline · Mockup</title>
<!--
==========================================================================================
  DASHBOARD BASELINE — STATIC MOCKUP
==========================================================================================
  A self-contained reference UI for analytics dashboards. No server, no internet, no libraries.
  All numbers are SAMPLE DATA generated in the browser.

  HOW THIS FILE IS ORGANISED (read in this order)
    1. <script id="dashboard-spec" type="application/json">
         The whole app described as data: app name, filters, KPI tiles, pages, cards, chart
         types, the Build-a-view data model and the data contracts every chart expects.
         The UI is generated from this JSON; to adapt the dashboard, edit the JSON first.
    2. <style> — DESIGN TOKENS (:root variables) then components. Re-theme by changing tokens.
    3. <body> — three layout regions: data-region="sidebar" | "topbar" | "page".
    4. <script> — sections marked  // ==== N. NAME ====
         1 Utilities · 2 Sample data (replace with API) · 3 Charts · 4 Render (payload -> chart)
         5 Cards board (drag/resize/hide/view) · 6 Standard pages · 7 Build a view
         8 My dashboard · 9 Blueprint page · 10 Filters and router

  TO USE IN ANOTHER APPLICATION
    a. Change "app", "filters", "kpis" and "pages" in the spec to that application's domain.
    b. Make the backend return the payload shapes in "contracts" (category / time / heat / table / overview).
    c. Replace SAMPLE.widget(), SAMPLE.overview(), SAMPLE.table() and SAMPLE.model with fetch() calls.
       Nothing else needs to change: charts, cards, layout and interactions read only those shapes.
==========================================================================================
-->

<!-- ======================= 1. SPEC: the dashboard described as data ======================= -->
<script id="dashboard-spec" type="application/json">

<!-- ======================= 2. DESIGN TOKENS and components ======================= -->
<style>
/* ---- tokens: change these to re-theme ---- */
:root {
  --bg: #f3f7fd; --panel: #ffffff; --fg: #0f1b33; --fg-muted: #5b6b85; --line: #dbe5f3; --grid: #e8eef7; --axis: #b9c6da;
  --side: linear-gradient(180deg, #e6f1ff 0%, #d3e5ff 100%); --side-line: #bcd6fb; --side-fg: #1d2352;
  --band: linear-gradient(115deg, #1e3a8a 0%, #2563eb 100%);
  --accent: #2563eb; --accent-dark: #1e3a8a; --muted-fill: #b8c4d6;
  --ok: #15803d; --warn: #b45309; --bad: #dc2626;
  /* chart series, in order: blue, teal, navy, sky, indigo, slate, light blue, red (problems only) */
  --c0: #2563eb; --c1: #0d9488; --c2: #1e3a8a; --c3: #0ea5e9; --c4: #6366f1; --c5: #64748b; --c6: #93c5fd; --c7: #dc2626;
  --radius: 10px; --gap: 16px; --shadow: 0 2px 12px rgba(29, 35, 82, .08);
  --font: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; --serif: Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1424; --panel: #141d31; --fg: #e8eefb; --fg-muted: #9aa8c2; --line: #26324b; --grid: #1f2a40; --axis: #3a4a68;
    --side: linear-gradient(180deg, #16233f 0%, #1b2b4d 100%); --side-line: #2a3d63; --side-fg: #dbe7ff;
    --muted-fill: #475569; --ok: #22c55e; --warn: #f59e0b; --bad: #f87171;
    --c0: #3b82f6; --c1: #14b8a6; --c2: #60a5fa; --c3: #38bdf8; --c4: #818cf8; --c5: #94a3b8; --c6: #bfdbfe; --c7: #f87171;
    --shadow: 0 2px 12px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
/* ---- base ---- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* ---- layout regions ---- */
.shell { display: grid; grid-template-columns: 15rem minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); border-right: 1px solid var(--side-line); color: var(--side-fg); }
.side-inner { position: sticky; top: 0; display: grid; gap: 16px; padding: 18px 14px; max-height: 100vh; overflow: auto; }
.brand { font-family: var(--serif); font-size: 26px; padding: 0 8px 12px; border-bottom: 1px solid var(--side-line); }
.brand small { display: block; font: 12px var(--font); opacity: .7; }
.nav { display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--side-fg); text-decoration: none; opacity: .85; }
.nav a::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--c6); flex: none; }
.nav a:hover { background: rgba(37, 99, 235, .1); opacity: 1; }
.nav a[aria-current="page"] { background: var(--accent); color: #fff; opacity: 1; font-weight: 600; box-shadow: 0 4px 12px rgba(37, 99, 235, .3); }
.nav a[aria-current="page"]::before { background: #fff; }
.nav .sep { height: 1px; background: var(--side-line); margin: 6px 4px; }
.side-note { font-size: 12px; opacity: .75; padding: 0 8px; }
.main { min-width: 0; padding: 18px 22px 40px; display: grid; gap: var(--gap); align-content: start; }
.top { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; justify-content: space-between; padding: 14px 20px; border-radius: 14px; color: #fff; background: var(--band); box-shadow: 0 8px 20px rgba(37, 99, 235, .22); }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .8; }
.window { font-family: var(--serif); font-size: 20px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---- KPI tile ---- */

/* ---- board and card ---- */

.dl-row i { font-style: normal; color: var(--fg-muted); min-width: 3em; text-align: right; }
/* ---- health rings ---- */

.gauge { margin: 0; display: grid; justify-items: center; gap: 2px; }

.ring-bg { fill: var(--grid); }
.ring-num { font-family: var(--serif); font-size: 22px; fill: var(--fg); }

.step-body select { width: 100%; }
.field { display: grid; gap: 2px; min-width: 0; }
.field > span { font-size: 12px; color: var(--fg-muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.gallery { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 16rem), 1fr)); }

.bp pre { margin: 0; padding: 12px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 5%, var(--panel)); border: 1px solid var(--line); overflow: auto; font: 12px/1.5 ui-monospace, Consolas, monospace; max-height: 320px; }
.bp ol, .bp ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.bp code { font: 12px ui-monospace, Consolas, monospace; background: var(--grid); padding: 1px 5px; border-radius: 4px; }
.wire { display: grid; grid-template-columns: 9rem 1fr; gap: 8px; min-height: 260px; font-size: 12px; }
.wire > div, .wire-main > div { border: 2px dashed var(--axis); border-radius: 8px; padding: 8px; color: var(--fg-muted); }
.wire-side { background: var(--side); }
.wire-main { display: grid; gap: 8px; grid-template-rows: auto auto 1fr; border: 0 !important; padding: 0 !important; }
.wire-band { background: var(--band); color: #fff !important; border-style: solid !important; border-color: transparent !important; }
.wire-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.wire-kpis span { border-radius: 6px; background: var(--accent); opacity: .7; color: #fff; padding: 6px; text-align: center; }
.wire-board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.wire-board span { border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 6px; background: var(--panel); padding: 10px 6px; text-align: center; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { display: grid; gap: 4px; justify-items: center; font-size: 11px; }
.swatch span { width: 48px; height: 32px; border-radius: 6px; border: 1px solid var(--line); }
.two { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); }
/* ---- responsive ---- */
@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .board > .card { grid-column: 1 / -1 !important; }
  .resize { display: none; }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side-inner { position: static; max-height: none; }
  .nav { display: flex; overflow-x: auto; }
  .nav a { white-space: nowrap; }
  .nav .sep, .side-note { display: none; }
  .main { padding: 12px 16px 32px; }
}

<!-- ======================= 3. LAYOUT REGIONS ======================= -->
<div class="shell">
  <aside class="side" data-region="sidebar">
    <div class="side-inner">
      <div class="brand" id="brand"></div>
      <nav class="nav" id="nav" aria-label="Pages"></nav>
      <p class="side-note" id="side-note"></p>
    </div>
  </aside>
  <main class="main">
    <header class="top" id="top" data-region="topbar">
      <div>
        <p class="eyebrow">Showing <span class="sample-badge">Sample data</span></p>
        <p class="window" id="window-label"></p>
      </div>
      <div class="filters">
        <div class="seg" id="range" role="group" aria-label="Period"></div>
        <span id="custom-dates" hidden><input type="date" id="from" aria-label="From"> – <input type="date" id="to" aria-label="To"></span>
        <select id="project" aria-label="Project"><option value="">All projects</option></select>
        <button type="button" class="btn" id="reset">Reset</button>
      </div>
    </header>
    <div id="page" data-region="page"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="tip" id="tip" hidden></div>

<script>
(() => {
  'use strict';
  const SPEC = JSON.parse(document.getElementById('dashboard-spec').textContent);

  // ==== 1. UTILITIES ====
  const $ = (s, r = document) => r.querySelector(s);
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return e;
  }
  function S(tag, attrs, parent) {
    const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs || {})) if (v != null) e.setAttribute(k, v);
    if (parent) parent.append(e);
    return e;
  }
  const T = (parent, x, y, str, attrs) => { const t = S('text', { x, y, ...attrs }, parent); t.textContent = str; return t; };
  const textW = (s) => String(s).length * 6.6; // approximate width at 11px; keeps the mockup free of layout reads
  const FMT = {
    int: (v) => (v == null ? '—' : Math.round(v).toLocaleString('en')),
    dec: (v) => (v == null ? '—' : (Math.round(v * 10) / 10).toLocaleString('en')),
    pct: (v) => (v == null ? '—' : Math.round(v * 100) + '%'),
    hours: (v) => (v == null ? '—' : Math.round(v).toLocaleString('en') + ' h'),
  };
  const fmtOf = (k) => FMT[k] || ((v) => (v == null ? '—' : Number.isInteger(v) ? FMT.int(v) : FMT.dec(v)));
  const chg = (v) => (v > 0 ? '+' : '') + Math.round(v * 100) + '%';
  const pretty = (s) => String(s).replace(/[._]/g, ' ').replace(/^./, (c) => c.toUpperCase());
  const PRETTY_DIMS = ['priority', 'type', 'role', 'action', 'area', 'overdue', 'done'];
  const labelFor = (dim, n) => (PRETTY_DIMS.includes(dim) ? pretty(n) : n);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const DAY = 864e5;
  const iso = (t) => new Date(t).toISOString().slice(0, 10);
  const fDate = (s) => new Date(s + 'T00:00:00Z').toLocaleDateString('en', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
  const fShort = (s) => new Date(s + 'T00:00:00Z').toLocaleDateString('en', { month: 'short', day: 'numeric', timeZone: 'UTC' });
  // Colours: blue family; red only for problems. Fixed colour per known value so a value keeps its colour everywhere.
  const C = (i) => `var(--c${((i % 8) + 8) % 8})`;
  const FIXED = {
    status: { 'To Do': 0, 'In Progress': 3, 'In Review': 6, Blocked: 7, Done: 2 },
    priority: { critical: 7, high: 2, medium: 0, low: 6 },
    type: { task: 0, user_story: 1, bug: 7, epic: 4 },
    column: { Backlog: 0, 'In Progress': 3, 'In Review': 6, Done: 2 },
    sprint_status: { Future: 0, Active: 3, 'Active, past end date': 7, Closed: 2 },
  };
  const SEMANTIC = { overdue: { overdue: 'var(--bad)', on_time: C(0) }, done: { done: C(2), not_done: 'var(--muted-fill)' } };
  function colorFor(dim, name, i) {
    if (name === '__other' || name === 'Other') return 'var(--muted-fill)';
    if (SEMANTIC[dim] && SEMANTIC[dim][name]) return SEMANTIC[dim][name];
    if (FIXED[dim] && FIXED[dim][name] !== undefined) return C(FIXED[dim][name]);
    return C(i);
  }
  // Per-browser memory (layouts, saved views, filters). In a real app: GET/PUT /api/state.
  const store = {
    get(k, d) { try { const v = localStorage.getItem('dashboard-mockup:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('dashboard-mockup:' + k, JSON.stringify(v)); } catch (e) { /* storage blocked: this visit only */ } },
  };
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3000); }
  function select(options, value, onChange, opts = {}) {
    const s = h('select', { 'aria-label': opts.label || null });
    if (opts.blank !== undefined) s.append(new Option(opts.blank, ''));
    for (const o of options) {
      if (o.group) { const g = h('optgroup', { label: o.group }); for (const [v, t] of o.items) g.append(new Option(t, v)); s.append(g); }
      else { const op = new Option(o[1], o[0]); if (opts.disabled && opts.disabled(o[0])) op.disabled = true; s.append(op); }
    }
    s.value = value == null ? '' : String(value);
    s.addEventListener('change', () => onChange(s.value));
    return s;
  }

  // ==== 2. SAMPLE DATA — replace these four functions with API calls returning the shapes in SPEC.contracts ====
  function rng(seed) {
    let a = 2166136261;
    for (let i = 0; i < seed.length; i++) a = Math.imul(a ^ seed.charCodeAt(i), 16777619);
    return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function windowOf(f) {
    if (f.range === 'custom' && f.from && f.to) return f.from <= f.to ? { from: f.from, to: f.to } : { from: f.to, to: f.from };
    const opt = SPEC.filters.range.options.find((o) => o.id === f.range) || SPEC.filters.range.options[0];
    const to = Date.parse(SPEC.app.asOf);
    return { from: iso(to - ((opt.days || 7) - 1) * DAY), to: SPEC.app.asOf };
  }
  function bucketsOf(w) {
    const days = (Date.parse(w.to) - Date.parse(w.from)) / DAY + 1;
    const step = days <= 31 ? 1 : days <= 120 ? 7 : 30;
    const keys = [];
    for (let t = Date.parse(w.from); t <= Date.parse(w.to); t += step * DAY) keys.push(iso(t));
    return { keys, grain: step === 1 ? 'day' : step === 7 ? 'week' : 'month', step };
  }
  const cardById = (id) => SPEC.pages.flatMap((p) => p.cards || []).find((c) => c.id === id);
  const SAMPLE = {
    overview(f) {
      const R = rng('kpi' + JSON.stringify(f));
      const w = windowOf(f), days = (Date.parse(w.to) - Date.parse(w.from)) / DAY + 1, scale = days / 7, proj = f.project ? 0.2 : 1;
      const kpis = {};
      for (const k of SPEC.kpis) {
        const base = k.base * proj * (k.snapshot || k.format === 'dec' ? 1 : scale);
        kpis[k.id] = k.format === 'dec' ? Math.round(base * (0.8 + 0.4 * R()) * 10) / 10 : Math.round(base * (0.85 + 0.3 * R()));
        if (!k.snapshot) kpis[k.id + '_prev'] = k.format === 'dec' ? Math.round(base * (0.7 + 0.6 * R()) * 10) / 10 : Math.round(base * (0.6 + 0.6 * R()));
      }
      const health = {};
      for (const g of SPEC.health) health[g.id] = clamp(g.sample + (f.project ? (R() - 0.5) * 0.3 : 0), 0, 1);
      return { kpis, health };
    },
    widget(card, f) {
      const spec = card.sample || (card.sampleFrom && cardById(card.sampleFrom).sample) || {};
      const R = rng(card.id + JSON.stringify(f));
      const w = windowOf(f), days = (Date.parse(w.to) - Date.parse(w.from)) / DAY + 1;
      const scale = spec.snapshot ? 1 : days / 7, proj = f.project ? 0.25 : 1;
      if (card.kind === 'heat') {
        const names = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        return { kind: 'heat', fmt: 'int', cols: [...Array(24).keys()].map((x) => String(x).padStart(2, '0')),
          rows: names.map((n, d) => ({ name: n, label: n, values: [...Array(24).keys()].map((hr) => (hr >= 9 && hr <= 19 && d < 5 ? Math.round((10 + 60 * R()) * scale * proj) : Math.round(4 * R() * scale * proj))) })) };
      }
      if (card.kind === 'time') {
        const { keys, grain, step } = bucketsOf(w);
        return { kind: 'time', grain, fmt: spec.fmt || 'int', dim: spec.dim, mixedUnits: spec.mixedUnits, keys,
          series: spec.series.map((s, i) => {
            let run = s.base * 2;
            return { name: s.name, label: s.label || s.name, fmt: s.fmt, color: s.color,
              values: keys.map((k, j) => {

  // ==== 5. CARDS BOARD — drag to move, corner to resize, ✕ to hide, dropdown for chart type ====
  // layout per page: { cardId: { o: order, w: width of 6, h: hidden, v: chart type, off: lines off, shapes } }
  function mountBoard(host, { cards, key, drawBody, onRemove, tools = true }) {
    const get = () => store.get('layout:' + key, {});

          h('button', { class: 'tool', type: 'button', text: '◀', title: 'Move earlier', 'aria-label': 'Move earlier', onclick: () => moveTo(c.id, ordered().indexOf(c) - 1) }),

          h('button', { class: 'tool', type: 'button', text: '✕', title: onRemove ? 'Remove' : 'Hide card', 'aria-label': onRemove ? 'Remove' : 'Hide card', onclick: () => { if (onRemove) onRemove(c); else { patch(c.id, { h: true }); apply(); } } }))));

  // ==== 7. BUILD A VIEW — pick a table, a calculation, a grouping, filters and a chart ====
  const MODEL = SPEC.model;
  function fieldsFrom(base) {
    const out = [];
    const t = MODEL.tables[base];
    for (const [col, [label, type]] of Object.entries(t.fields)) out.push({ path: col, label, type, group: t.label });
    for (const l of t.links || []) for (const [col, [label, type]] of Object.entries(MODEL.tables[l.to].fields)) out.push({ path: `${l.col}.${col}`, label: `${l.name} › ${label}`, type, group: l.name });
    return out;
  }

  function valueOf(base, ref) {
    const [path, part] = String(ref).split('|');
    const [a, b] = path.split('.');
    const get = b ? (r) => { const t = SAMPLE.model.items[r[a] - 1]; return t ? t[b] : null; } : (r) => r[a];
    if (part === 'month') return (r) => (get(r) ? String(get(r)).slice(0, 7) : null);
    if (part === 'weekday') return (r) => (get(r) ? ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(get(r)).getUTCDay()] : null);
    return get;

    for (const f of v.filters || []) if (f.field && f.value !== '') { const g = valueOf(v.base, f.field); rows = rows.filter((r) => String(g(r)) === String(f.value)); }
    const m = v.fn === 'count' ? null : valueOf(v.base, v.field);
    const calc = (rs) => {
      if (v.fn === 'count') return rs.length;
      const vals = rs.map(m).filter((x) => x != null);
      if (v.fn === 'distinct') return new Set(vals).size;
      if (!vals.length) return null;
      if (v.fn === 'sum') return vals.reduce((a, b) => a + b, 0);
      if (v.fn === 'avg') return vals.reduce((a, b) => a + b, 0) / vals.length;
      return v.fn === 'min' ? Math.min(...vals) : Math.max(...vals);
    };

    { id: 's2', title: 'Average cycle time by priority', base: 'items', fn: 'avg', field: 'cycle_hours', group: 'priority', filters: [], chart: 'column' },
    { id: 's3', title: 'Work items created per month', base: 'items', fn: 'count', group: 'created|month', filters: [], chart: 't:line' },
    { id: 's4', title: 'Open work by assignee', base: 'items', fn: 'count', group: 'assignee', filters: [{ field: 'status', value: 'To Do' }], chart: 'donut' },

    const res = runView(v);
    if (v.chart === 'kpi') return box.replaceChildren(h('div', { style: 'font:44px var(--serif);color:var(--accent);padding:12px 0' }, fmtOf('auto')(res.total)));
    const data = viewPayload(res, v);
    if (!data) return empty(box, 'Pick a field in "Group by".');
    // time charts need a month grouping; with any other grouping they fall back to columns
    const view = data.kind === 'time' ? (v.chart.startsWith('t:') ? v.chart.slice(2) : 'line') : v.chart.startsWith('t:') ? 'column' : v.chart;
    render(box, data, view, { onPick: onPick && ((d) => onPick(typeof d === 'number' ? res.groups[d] : res.groups.find((g) => g.key === d.name))) });
    return res;
  }
  function buildPage(area) {
    const draft = store.get('draft', STARTERS[0]);
    const up = (p) => { store.set('draft', { ...draft, ...p }); route(); };
    const saved = store.get('views', STARTERS);
    const opts = (accept, parts) => { const g = new Map(); for (const f of fieldsFrom(draft.base)) { if (!accept(f)) continue; if (!g.has(f.group)) g.set(f.group, []); g.get(f.group).push([f.path, f.label.split(' › ').pop()]); if (parts && f.type === 'date') for (const [p, l] of MODEL.dateParts) g.get(f.group).push([`${f.path}|${p}`, `${f.label.split(' › ').pop()} (${l})`]); } return [...g].map(([group, items]) => ({ group, items })); };
    const step = (n, label, ...kids) => h('div', { class: 'step' }, h('span', { class: 'step-num', text: n }), h('b', { text: label }), h('div', { class: 'step-body' }, kids));
    const fld = (label, control) => h('label', { class: 'field' }, h('span', { text: label }), control);
    const editor = h('section', { class: 'card' },
      h('div', { class: 'row' },
        h('input', { type: 'text', value: draft.title || '', placeholder: describe(draft), 'aria-label': 'Name of this view', style: 'flex:1 1 18rem;font-weight:600', onchange: (e) => up({ title: e.target.value }) }),
        h('div', { class: 'toolbar' },
          h('button', { class: 'btn primary', type: 'button', text: 'Save view', onclick: () => { const v = { ...draft, id: 'v' + Date.now(), title: draft.title || describe(draft) }; store.set('views', [...saved, v]); store.set('draft', v); toast('Saved to My views.'); route(); } }),
          h('button', { class: 'btn', type: 'button', text: 'Add to My dashboard', onclick: () => { const v = { ...draft, id: draft.id || 'v' + Date.now(), title: draft.title || describe(draft) }; if (!saved.some((x) => x.id === v.id)) store.set('views', [...saved, v]); const b = store.get('board', []); if (!b.includes(v.id)) store.set('board', [...b, v.id]); store.set('draft', v); toast('Added to My dashboard.'); } }),
          h('button', { class: 'btn', type: 'button', text: 'Start over', onclick: () => up({ ...BLANK, id: null }) }))),
      h('div', { class: 'steps' },
        step(1, 'Start from', fld('Table', select(Object.entries(MODEL.tables).map(([k, t]) => [k, t.label]), draft.base, (v) => up({ base: v, field: '', group: '', filters: [] })))),
        step(2, 'What to calculate', fld('Calculate', select(MODEL.functions, draft.fn, (v) => up({ fn: v }))),
          draft.fn === 'count' ? null : fld('Field', select(opts((f) => draft.fn === 'distinct' || f.type === 'number'), draft.field, (v) => up({ field: v }), { blank: 'Choose a field…' }))),
        step(3, 'Group by', fld('Field', select(opts((f) => f.type !== 'number', true), draft.group, (v) => up({ group: v, chart: v.endsWith('|month') ? 't:line' : draft.chart.startsWith('t:') ? 'bar' : draft.chart }), { blank: 'No grouping' }))),
        step(4, 'Show as', fld('Chart', select(CHARTS, draft.chart, (v) => up({ chart: v }))))),
      h('div', { class: 'stack' }, h('b', { text: 'Only include rows where' }),
        (draft.filters || []).map((f, i) => h('div', { class: 'toolbar' },
          select(opts((x) => x.type === 'text'), f.field, (v) => up({ filters: draft.filters.map((x, k) => (k === i ? { field: v, value: '' } : x)) }), { blank: 'Choose a field…', label: 'Field' }),
          h('span', { class: 'note', text: 'is' }),
          f.field ? select([...new Set(SAMPLE.model[draft.base].map(valueOf(draft.base, f.field)))].filter((x) => x != null).sort().map((x) => [x, x]), f.value, (v) => up({ filters: draft.filters.map((x, k) => (k === i ? { ...x, value: v } : x)) }), { blank: 'Choose…', label: 'Value' }) : null,
          h('button', { class: 'tool', type: 'button', text: '✕', 'aria-label': 'Remove filter', onclick: () => up({ filters: draft.filters.filter((x, k) => k !== i) }) }))),
        h('div', null, h('button', { class: 'btn', type: 'button', text: '+ Add filter', onclick: () => up({ filters: [...(draft.filters || []), { field: '', value: '' }] }) }))));
    const box = h('div', { class: 'card-body' });
    const records = h('div');
    const result = h('section', { class: 'card' }, h('h2', { style: 'font-size:15px', text: draft.title || describe(draft) }), box);
    area.append(editor, result, records);
    const res = drawView(box, draft, (g) => {
      // real app: POST /api/model/records { spec, sel, page }
      if (!g) return;
      const cols = Object.keys(MODEL.tables[draft.base].fields);
      records.replaceChildren(h('section', { class: 'card' }, h('div', { class: 'row' }, h('h2', { style: 'font-size:15px', text: `Records: ${g.key} (${g.rows.length})` }), h('button', { class: 'btn', type: 'button', text: 'Close', onclick: () => records.replaceChildren() })),
        h('div', { class: 'scroll tall' }, h('table', { class: 'table' }, h('thead', null, h('tr', null, cols.map((c) => h('th', { text: MODEL.tables[draft.base].fields[c][0] })))),
          h('tbody', null, g.rows.slice(0, 10).map((r) => h('tr', null, cols.map((c) => h('td', { text: r[c] == null ? '—' : String(r[c]) })))))))));
    });
    if (res) result.append(h('p', { class: 'note', text: `${res.rows.length} rows · result ${fmtOf('auto')(res.total)} · click a bar or slice to see its records` }));
    area.append(h('section', { class: 'card' }, h('h2', { style: 'font-size:15px', text: 'My views' }),
      h('div', { class: 'gallery' }, saved.map((v) => h('div', { class: 'tile' }, h('b', { text: v.title }), h('span', { class: 'note', text: describe(v) }),
        h('div', { class: 'toolbar' },
          h('button', { class: 'btn primary', type: 'button', text: 'Open', onclick: () => { store.set('draft', v); route(); } }),
          h('button', { class: 'btn danger', type: 'button', text: 'Delete', onclick: () => { store.set('views', saved.filter((x) => x.id !== v.id)); store.set('board', store.get('board', []).filter((x) => x !== v.id)); route(); } })))))));
  }

  // ==== 8. MY DASHBOARD — saved views as movable, resizable cards ====
  function minePage(area) {
    const views = store.get('views', STARTERS);
    const ids = store.get('board', []).filter((id) => views.some((v) => v.id === id));
    if (!ids.length) return area.append(h('section', { class: 'card' }, h('h2', { style: 'font-size:15px', text: 'Nothing pinned yet' }), h('p', { class: 'note', text: 'Open Build a view and press "Add to My dashboard".' }), h('div', null, h('a', { class: 'btn primary', href: '#build', text: 'Go to Build a view' }))));
    const host = h('div');
    area.append(host);
    const cards = ids.map((id) => { const v = views.find((x) => x.id === id); return { id, title: v.title, w: 3, views: 'mine', view: v.chart, spec: v }; });
    mountBoard(host, { cards, key: 'mine',
      onRemove: (c) => { store.set('board', store.get('board', []).filter((x) => x !== c.id)); route(); },
      drawBody: (c, body, extra, s) => drawView(body, { ...c.spec, chart: s.v || c.spec.chart }) });
  }
  SPEC.chartTypes.mine = CHARTS; // the chart list of saved views, used by the My dashboard cards

  // ==== 9. BLUEPRINT — the structure explained on the page, generated from the spec ====
  function blueprintPage(area) {
    const sec = (title, ...kids) => h('section', { class: 'card' }, h('h2', { style: 'font-size:16px', text: title }), ...kids);
    const tokens = ['--accent', '--accent-dark', '--bg', '--panel', '--fg', '--fg-muted', '--line', '--ok', '--warn', '--bad', '--c0', '--c1', '--c2', '--c3', '--c4', '--c5', '--c6', '--c7'];
    const cs = getComputedStyle(document.documentElement);
    area.append(h('div', { class: 'bp' },
      sec('What this is', h('p', { text: 'A static mockup and reference for analytics dashboards. Every page, card and chart is generated from the JSON spec at the top of this file (#dashboard-spec). All numbers are sample data. To build the same dashboard in another application, keep the structure and contracts below and change the spec and the data source.' })),
      h('div', { class: 'two' },
        sec('Layout', h('div', { class: 'wire' },
          h('div', { class: 'wire-side' }, 'Sidebar', h('br'), 'brand · pages · data note'),
          h('div', { class: 'wire-main' },
            h('div', { class: 'wire-band' }, 'Top band: period shown · period buttons · project · reset'),
            h('div', { class: 'wire-kpis' }, [...Array(8)].map((x, i) => h('span', { text: 'KPI ' + (i + 1) }))),
            h('div', { class: 'wire-board' }, h('span', { style: 'grid-column:span 4', text: 'Card w=4' }), h('span', { style: 'grid-column:span 2', text: 'w=2' }), h('span', { style: 'grid-column:span 3', text: 'w=3' }), h('span', { style: 'grid-column:span 3', text: 'w=3' }), h('span', { style: 'grid-column:span 6', text: 'w=6' })))),
          h('p', { class: 'note', text: SPEC.layout.page })),
        sec('Design tokens', h('div', { class: 'swatches' }, tokens.map((t) => h('div', { class: 'swatch' }, h('span', { style: `background:var(${t})` }), h('code', { text: t }), h('span', { class: 'note', text: cs.getPropertyValue(t).trim() })))),
          h('ul', null, SPEC.chartRules.map((r) => h('li', { text: r }))))),
      sec('Components', h('div', { class: 'scroll' }, h('table', { class: 'table' }, h('thead', null, h('tr', null, ['Component', 'Where in the code', 'Does'].map((x) => h('th', { text: x })))),
        h('tbody', null, [
          ['Sidebar navigation', 'data-region="sidebar", #nav', 'One link per spec page; current page highlighted'],
          ['Filter band', 'data-region="topbar"', 'Period presets + custom dates + project; every standard page re-renders'],
          ['KPI tile', 'kpiStrip()', 'Number, change vs previous period (▲ good / ▼ bad by "better"), colour from spec'],
          ['Health ring', 'healthRings()', 'Share with Good/Watch/Risk word and colour (rule in spec.healthRule)'],
          ['Card frame', 'mountBoard()', 'Title, drag handle, chart-type select, ◀ ▶, ✕, resize corner; layout remembered'],
          ['Line chips', 'drawStandardCard()', 'Toggle lines of a multi-line card; "Compare shapes" for mixed units'],
          ['Chart renderer', 'render() + section 3', 'Draws category / time / heat payloads in 18 chart types'],
          ['Paged table', 'sampleTable()', '10 rows a page, sort by header, search'],
          ['View builder', 'buildPage()', 'Table → calculation → group → filters → chart; records on click; save and pin'],
          ['My dashboard', 'minePage()', 'Pinned views as a board of cards'],
        ].map((r) => h('tr', null, r.map((c) => h('td', { text: c })))))))),
      sec('Pages and cards (from the spec)', h('div', { class: 'scroll' }, h('table', { class: 'table' }, h('thead', null, h('tr', null, ['Page', 'Card', 'Data kind', 'Width', 'Chart types'].map((x) => h('th', { text: x })))),
        h('tbody', null, SPEC.pages.flatMap((p) => (p.cards || [{ title: '(' + p.special + ' page)' }]).map((c) => h('tr', null, h('td', { text: p.label }), h('td', { text: c.title }), h('td', { text: c.kind || '' }), h('td', { text: c.w || '' }), h('td', { text: c.views ? SPEC.chartTypes[c.views].map((x) => x[1]).join(', ') : '' })))))))),
      h('div', { class: 'two' },
        sec('Data contracts (what the backend returns)', h('pre', { text: JSON.stringify(SPEC.contracts, null, 2) })),
        sec('Interactions', h('ul', null, SPEC.interactions.map((x) => h('li', { text: x }))))),
      sec('How to reuse this in another application', h('ol', null,
        h('li', null, 'Copy this file. Edit ', h('code', { text: '#dashboard-spec' }), ': app name, period options, KPIs, pages and cards for the new domain.'),
        h('li', null, 'Build one API endpoint per card that returns the matching contract (category, time, heat or table) for the period and filters.'),
        h('li', null, 'Replace ', h('code', { text: 'SAMPLE.overview / widget / table / model' }), ' with fetch() calls; keep the payload shapes.'),
        h('li', null, 'Keep the rules: blue family for data, red only for problems; no stacking of different units; tables page 10 rows; every value has a tooltip.'),
        h('li', null, 'For Build a view, describe the tables, fields and links on the server and turn choices into SQL with parameters; never accept SQL from the browser.'),
        h('li', null, 'Store layouts and saved views per user (here: localStorage; in an app: an API), never mixed into business data.'))),
    ));
  }

  // ==== 10. FILTERS AND ROUTER ====
  const filters = () => ({ range: SPEC.filters.range.default, project: '', from: '', to: '', ...store.get('filters', {}) });
  const setFilters = (p) => { store.set('filters', { ...filters(), ...p }); syncBar(); route(); };
  function syncBar() {
    const f = filters(), w = windowOf(f);
    document.querySelectorAll('#range button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === f.range)));
    $('#custom-dates').hidden = f.range !== 'custom';
    $('#from').value = w.from;
    $('#to').value = w.to;
    $('#project').value = f.project;
    $('#window-label').textContent = `${fDate(w.from)} – ${fDate(w.to)}`;
  }
  function route() {
    const id = location.hash.slice(1);
    const page = SPEC.pages.find((p) => p.id === id) || SPEC.pages[0];
    document.querySelectorAll('#nav a').forEach((a) => a.setAttribute('aria-current', a.dataset.page === page.id ? 'page' : 'false'));
    $('#top').hidden = !!page.special;
    document.title = page.label + ' · ' + SPEC.app.name + ' mockup';
    const area = h('div', { class: 'page-area' });
    $('#page').replaceChildren(h('h1', { class: 'page-title', text: page.label }), area);
    if (page.special === 'build') return buildPage(area);
    if (page.special === 'mine') return minePage(area);
    if (page.special === 'blueprint') return blueprintPage(area);
    standardPage(area, page, filters());
  }
  function start() {
    $('#brand').append(SPEC.app.name, h('small', { text: SPEC.app.tagline }));
    const nav = $('#nav');
    SPEC.pages.forEach((p) => { if (p.special === 'blueprint') nav.append(h('div', { class: 'sep' })); nav.append(h('a', { href: '#' + p.id, 'data-page': p.id, text: p.label })); });
    $('#side-note').textContent = `Sample data as of ${fDate(SPEC.app.asOf)}. Replace with your API.`;
    for (const o of SPEC.filters.range.options) {
      $('#range').append(h('button', { type: 'button', 'data-id': o.id, text: o.label, onclick: () => {
        if (o.id === 'custom') { const w = windowOf(filters()); setFilters({ range: 'custom', from: w.from, to: w.to }); } else setFilters({ range: o.id });
      } }));
    }
    for (const p of SPEC.filters.project.options) $('#project').append(new Option(p, p));
    $('#project').addEventListener('change', (e) => setFilters({ project: e.target.value }));
    for (const el of [$('#from'), $('#to')]) el.addEventListener('change', () => { if ($('#from').value && $('#to').value) setFilters({ range: 'custom', from: $('#from').value, to: $('#to').value }); });
    $('#reset').addEventListener('click', () => setFilters({ range: SPEC.filters.range.default, project: '', from: '', to: '' }));
    let t;
    window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(route, 200); });
    window.addEventListener('hashchange', route);
    syncBar();
    route();
  }
  start();
})();
</script>
</body>
